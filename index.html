<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Kalkulator Gaji Bersih</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Kalkulator Gaji Bersih</h1>
      <p class="sub">PPh 21 bulanan dengan tarif TER (PP 58/2023)</p>
    </header>

    <label class="field" for="status">
      <span class="field-label">Status PTKP</span>
      <span class="input-box select-box">
        <select id="status">
          <optgroup label="Tidak kawin">
            <option value="TK/0" selected>TK/0 · tanpa tanggungan</option>
            <option value="TK/1">TK/1 · 1 tanggungan</option>
            <option value="TK/2">TK/2 · 2 tanggungan</option>
            <option value="TK/3">TK/3 · 3 tanggungan</option>
          </optgroup>
          <optgroup label="Kawin">
            <option value="K/0">K/0 · tanpa tanggungan</option>
            <option value="K/1">K/1 · 1 tanggungan</option>
            <option value="K/2">K/2 · 2 tanggungan</option>
            <option value="K/3">K/3 · 3 tanggungan</option>
          </optgroup>
        </select>
      </span>
    </label>

    <label class="field" for="gaji">
      <span class="field-label">Gaji kotor per bulan</span>
      <span class="input-box">
        <span class="prefix">Rp</span>
        <input id="gaji" type="text" inputmode="numeric" autocomplete="off"
               placeholder="0" aria-describedby="error">
      </span>
    </label>
    <p id="error" class="error" role="alert"></p>

    <section class="card" aria-live="polite">
      <div class="hero">
        <span class="hero-label">Gaji bersih (take home pay)</span>
        <strong id="bersih" class="hero-value">Rp0</strong>
        <span class="hero-meta">
          <span id="status-hasil" class="badge">TK/0</span>
          <span id="kategori" class="badge">TER kategori A</span>
        </span>
      </div>
      <dl class="rows">
        <div class="row">
          <dt>Gaji kotor</dt>
          <dd id="kotor">Rp0</dd>
        </div>
        <div class="row">
          <dt>Potongan PPh 21 <span id="tarif" class="badge">0%</span></dt>
          <dd id="pph" class="minus">−Rp0</dd>
        </div>
      </dl>
    </section>

    <p class="note">Berlaku untuk masa Januari–November. Belum termasuk BPJS dan potongan lain.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
